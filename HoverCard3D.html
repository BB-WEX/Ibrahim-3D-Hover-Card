<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hover Card</title>
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="card-container">

        <div class="HoverCard">

            <div class="InnerCard">

                <div class="Title">

                    <h1>3D Hover Card</h1>

                    <div class="PFP">
                        <div class="CircleEffect Outer">
                            <div class="CircleEffect Middle">
                                <div class="CircleEffect Inner">
                                    <img src="https://i.pinimg.com/736x/77/e7/07/77e707b8563bb641e34271951b91f3b0.jpg"
                                        alt="">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="Description">
                        <p>Hover me to find out more information</p>
                    </div>

                </div>

                <div class="ExpandDesc"></div>

                <div class="Btns">
                    <div class="SocialBtns">
                        <a href="#" class="fa fa-linkedin"></a>
                        <a href="#" class="fa fa-github"></a>
                        <a href="#" class="fa fa-google"></a>
                    </div>
                    <div class="ExpandBtn">
                        <button onclick="Expnado()"><h1>Expand</h1></button>
                        <h1>^</h1>
                    </div>
                </div>


            </div>

        </div>

    </div>

</body>

</html>
