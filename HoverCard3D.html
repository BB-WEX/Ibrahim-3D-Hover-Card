<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hover Card</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div class="card-container"> 
        
        <div class="HoverCard">
    
            <div class="InnerCard">
    
                <div class="Title">
                    <div class="PFP">
                        <div class="CircleEffect Outer">
                            <div class="CircleEffect Middle">
                                <div class="CircleEffect Inner">
                                    <img src="https://i.pinimg.com/736x/77/e7/07/77e707b8563bb641e34271951b91f3b0.jpg" alt="">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="Description"></div>
                </div>
                
                <div class="ExpandDesc"></div>
    
                <div class="Btns">
                    <div class="SocialBtns"></div>
                    <div class="ExpandBtn"></div>
                </div>
    
    
            </div>
    
        </div>

    </div>

</body>
</html>
